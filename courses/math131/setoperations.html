  <script>
    const startBtn = document.getElementById('start-btn');
    const hintBtn = document.getElementById('hint-btn');
    const questionText = document.getElementById('question-text');
    const operationQuestion = document.getElementById('operation-question');
    const activityBox = document.getElementById('my-activity');
    const hintArea = document.getElementById('hint-area');
    const pick = xs => xs[Math.floor(Math.random() * xs.length)];
    const rand = (a,b) => a + Math.floor(Math.random() * (b-a+1));
    let problem = null, regions = null;

    const SET_NAMES=['A','B','C','empty','universe'];
    const OPERATIONS=['intersection','union','difference'];
    const TEX_NAMES={A:'A',B:'B',C:'C',empty:'\\emptyset',universe:'U'};
    const TEX_OPERATIONS={intersection:'\\cap',union:'\\cup',difference:'\\setminus'};
    function generateSetExpression() {
      const pairCount=rand(1,3);
      const pairs=Array.from({length:pairCount},()=>{
        const pair={type:'operation',operation:pick(OPERATIONS),
          left:{type:'set',name:pick(SET_NAMES)},
          right:{type:'set',name:pick(SET_NAMES)}};
        return Math.random()<0.3 ? {type:'complement',operand:pair} : pair;
      });
      let expression=pairs[0];
      for(let i=1;i<pairs.length;i++) {
        expression={type:'operation',operation:pick(OPERATIONS),left:expression,right:pairs[i]};
      }
      return Math.random()<0.3 ? {type:'complement',operand:expression} : expression;
    }
    function expressionTex(node) {
      if(node.type==='set') return TEX_NAMES[node.name];
      if(node.type==='complement') {
        const operand=expressionTex(node.operand);
        return node.operand.type==='complement'
          ? `\\left[${operand}\\right]^{\\complement}`
          : `${operand}^{\\complement}`;
      }
      const left=expressionTex(node.left),right=expressionTex(node.right);
      const opening=node.left.type==='set' ? '(' : '\\left(';
      const closing=node.left.type==='set' ? ')' : '\\right)';
      return `${opening}${left} ${TEX_OPERATIONS[node.operation]} ${right}${closing}`;
    }
    function expressionContains(node,mask) {
      if(node.type==='set') {
        if(node.name==='empty') return false;
        if(node.name==='universe') return true;
        return !!(mask&(1<<'ABC'.indexOf(node.name)));
      }
      if(node.type==='complement') return !expressionContains(node.operand,mask);
      const left=expressionContains(node.left,mask),right=expressionContains(node.right,mask);
      if(node.operation==='intersection') return left&&right;
      if(node.operation==='union') return left||right;
      return left&&!right;
    }

    // Common, concrete words; a word contributes each of its distinct letters once.
    const WORDS = `apple orange banana lemon lime peach pear plum grape cherry berry melon mango kiwi fig date coconut pineapple apricot avocado tomato potato carrot onion garlic celery lettuce cabbage spinach broccoli cauliflower pepper cucumber pumpkin squash zucchini radish turnip beet pea bean corn rice wheat oats barley bread toast bagel biscuit muffin cake cookie pie tart candy chocolate sugar honey syrup butter cheese milk cream yogurt egg bacon sausage ham chicken turkey duck beef pork fish salmon tuna shrimp crab lobster oyster clam soup salad sandwich pizza pasta noodle dumpling pancake waffle cereal

    const UNIQUE_WORDS = [...new Set(WORDS.filter(w => /^[a-z]{3,}$/.test(w)))];

    function masks(sets, universe) {
      const result = new Set();
      for (const x of universe) {
        let mask = 0;
        sets.forEach((set,i) => { if (set(x)) mask |= 1 << i; });
        result.add(mask);
      }
      return result;
    }
    function relations(p) {
      const m = p.masks;
      const subset = [0,1,2].some(i => [0,1,2].some(j => i !== j &&
        [...m].every(v => !(v & (1<<i)) || (v & (1<<j))) &&
        [...m].some(v => (v & (1<<j)) && !(v & (1<<i)))));
      const disjoint = [0,1,2].some(i => [0,1,2].some(j => i < j &&
        ![...m].some(v => (v & (1<<i)) && (v & (1<<j)))));
      return {subset,disjoint};
    }
    function wordProblem() {
      const words = Array.from({length:3}, () => pick(UNIQUE_WORDS));
      if (new Set(words).size !== 3) return null;
      const sets = words.map(w => new Set(w));
      const p = {kind:'word', labels:words.map(w => `\\{x\\mid x\\text{ is a letter in the word “${w}”}\\}`),
        masks:masks(sets.map(s => x => s.has(x)), 'abcdefghijklmnopqrstuvwxyz')};
      return [1,2,4].every(bit => [...p.masks].some(m => m & bit)) ? p : null;
    }
    function intervalProblem(unbounded) {
      const natural = Math.random() < 0.38;
      const domainMin = natural ? 1 : -Infinity;
      const intervals = Array.from({length:3}, () => {
        let lo = rand(natural ? -8 : -12, natural ? 13 : 10), hi = lo + rand(2,13);
        let left = Math.random()<0.5, right = Math.random()<0.5;
        if (unbounded && Math.random()<0.42) {
          if (Math.random()<0.5) lo=-Infinity; else hi=Infinity;
        }
        return {lo,hi,left,right};
      });
      // A lower-unbounded inequality over N is finite; require an upper-
      // unbounded one somewhere so this problem type truly includes infinity.
      if (unbounded && !intervals.some(v => v.hi===Infinity || (!natural && v.lo===-Infinity))) {
        pick(intervals).hi=Infinity;
      }
      const contains=(v,x) => x>=domainMin && (x>v.lo || (v.left && x===v.lo)) && (x<v.hi || (v.right && x===v.hi));
      const endpoints = intervals.flatMap(v=>[v.lo,v.hi]).filter(Number.isFinite);
      const min=Math.min(...endpoints, natural?1:-15)-2, max=Math.max(...endpoints,18)+2;
      const samples=[]; for(let x=min;x<=max;x++) samples.push(x);
      if (!natural) samples.push(min-10000); samples.push(max+10000);
      const domain=natural?'\\mathbb{N}':'\\mathbb{Z}';
      const labels=intervals.map(v => {
        const lo=isFinite(v.lo)?`${v.lo} ${v.left?'\\leq':'<'} x`:'';
        const hi=isFinite(v.hi)?`x ${v.right?'\\leq':'<'} ${v.hi}`:'';
        return `\\{x\\in ${domain}\\mid ${lo && hi ? `${lo} ${v.right?'\\leq':'<'} ${v.hi}` : lo || hi}\\}`;
      });
      const p={kind:unbounded?'unbounded':'bounded',labels,masks:masks(intervals.map(v=>x=>contains(v,x)),samples)};
      return [1,2,4].every(bit=>[...p.masks].some(m=>m&bit))?p:null;
    }
    function relationshipCase(p) {
      const ms=[...p.masks];
      const has=(mask,i)=>!!(mask&(1<<i));
      const proper=(i,j)=>i!==j && ms.every(mask=>!has(mask,i)||has(mask,j)) &&
        ms.some(mask=>has(mask,j)&&!has(mask,i));
      const subsets=[];
      for(let i=0;i<3;i++) for(let j=0;j<3;j++) if(proper(i,j)) subsets.push([i,j]);
      const disjoint=[];
      for(let i=0;i<3;i++) for(let j=i+1;j<3;j++)
        if(!ms.some(mask=>has(mask,i)&&has(mask,j))) disjoint.push([i,j]);
      if(subsets.length && disjoint.length) {
        return disjoint.length===2 ? 'mixed-isolated' : 'mixed-overlap';
      }
      if(subsets.length) return subsets.length>=3 ? 'subset-chain' :
        subsets.length===2 ? 'subset-both' : 'subset-one';
      if(disjoint.length) return ['','disjoint-pair','disjoint-isolated','disjoint-all'][disjoint.length];
      return 'neither';
    }
    // A word chain is rare under independent draws, so build its three words
    // directly from their letter sets while keeping the word database random.
    let wordChains=null;
    function wordChainProblem() {
      if(!wordChains) {
        const letters=UNIQUE_WORDS.map(word=>[...word].reduce((bits,ch)=>bits|(1<<(ch.charCodeAt(0)-97)),0));
        const smaller=letters.map(()=>[]),larger=letters.map(()=>[]);
        for(let i=0;i<letters.length;i++) for(let j=0;j<letters.length;j++) {
          if(letters[i]!==letters[j] && (letters[i]&letters[j])===letters[i]) {
            larger[i].push(j);smaller[j].push(i);
          }
        }
        wordChains={letters,smaller,larger,centres:letters.map((_,i)=>i).filter(i=>smaller[i].length&&larger[i].length)};
      }
      const centre=pick(wordChains.centres);
      const words=[pick(wordChains.smaller[centre]),centre,pick(wordChains.larger[centre])]
        .map(i=>UNIQUE_WORDS[i]);
      const shuffled=[...words];
      for(let i=shuffled.length-1;i>0;i--) {
        const j=rand(0,i);
        [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
      }
      const sets=shuffled.map(word=>new Set(word));
      return {kind:'word',labels:shuffled.map(word=>`\\{x\\mid x\\text{ is a letter in the word “${word}”}\\}`),
        masks:masks(sets.map(set=>x=>set.has(x)),'abcdefghijklmnopqrstuvwxyz')};
    }
    function makeProblem() {
      const kind=rand(0,2);
      const target=Math.random();
      const group=target<0.3 ? ['subset-one','subset-both','subset-chain'] :
        target<0.6 ? ['disjoint-all','disjoint-isolated','disjoint-pair'] :
        target<0.65 ? ['mixed-isolated'] :
        target<0.7 ? ['mixed-overlap'] : ['neither'];
      const chosen=pick(group); // equal chance for each case within the 30% groups
      for(let attempt=0;attempt<30000;attempt++) {
        const p=kind===0 && chosen==='subset-chain' ? wordChainProblem() :
          kind===0 ? wordProblem() : intervalProblem(kind===2);
        if(p && relationshipCase(p)===chosen) return p;
      }
      throw new Error(`Unable to generate ${chosen} problem`);
    }

    // Where all three sets meet, use the familiar three-circle Venn diagram.
    // Its other regions can be empty without changing the diagram.
    const U={x:70,y:55,w:960,h:470};
    function inShape(x,y,c) {
      if (!c) return false;
      const distance=Math.hypot(x-c.x,y-c.y);
      if (c.type !== 'annular-sector') return distance<c.r;
      const angle=Math.atan2(y-c.y,x-c.x);
      const difference=Math.atan2(Math.sin(angle-c.angle),Math.cos(angle-c.angle));
      return distance>=c.inner && distance<=c.r && Math.abs(difference)<c.halfAngle;
    }
    const pointMask=(x,y,circles) => circles.reduce((v,c,i)=>v | (inShape(x,y,c) ? 1<<i:0),0);
    function circleMasks(circles) {
      const found=new Set([0]);
      for(let y=U.y+4;y<U.y+U.h;y+=12) for(let x=U.x+4;x<U.x+U.w;x+=12)
        found.add(pointMask(x,y,circles));
      return found;
    }
    function circleLayout(actual) {
      const includes=(mask,i)=>!!(mask&(1<<i));
      const overlaps=(i,j)=>[...actual].some(mask=>includes(mask,i)&&includes(mask,j));
      const subset=(i,j)=>i!==j && [...actual].every(mask=>!includes(mask,i)||includes(mask,j));
      const proper=(i,j)=>subset(i,j)&&!subset(j,i);
      const pairs=[[0,1],[0,2],[1,2]];
      // All three disjoint sets have three separate, equally spaced circles.
      if (pairs.every(([i,j])=>!overlaps(i,j))) return {circles:[
        {x:270,y:275,r:120},{x:550,y:275,r:120},{x:830,y:275,r:120}
      ]};
      // An intersection equal to a named set needs only the two outer circles.
      for (let i=0;i<3;i++) {
        const [j,k]=[0,1,2].filter(index=>index!==i);
        if ([...actual].every(mask=>includes(mask,i)===(includes(mask,j)&&includes(mask,k)))) {
          const circles=[];
          circles[j]={x:420,y:275,r:165};
          circles[k]={x:640,y:275,r:165};
          circles[i]=null;
          return {circles,alias:i,intersection:[j,k]};
        }
      }
      // Show proper containment before checking the triple intersection.
      const child=[0,1,2].find(i=>[0,1,2].filter(j=>proper(i,j)).length===2)
        ?? [0,1,2].find(i=>[0,1,2].some(j=>proper(i,j)));
      if (child!==undefined) {
        const parents=[0,1,2].filter(j=>proper(child,j));
        const circles=[];
        if (parents.length===2) {
          const [first,second]=parents;
          if (proper(first,second)||proper(second,first)) {
            const middle=proper(first,second)?first:second;
            const outer=middle===first?second:first;
            circles[outer]={x:550,y:275,r:190};
            circles[middle]={x:550,y:275,r:115};
            circles[child]={x:550,y:275,r:48};
          } else {
            circles[first]={x:420,y:275,r:165};
            circles[second]={x:640,y:275,r:165};
            circles[child]={x:530,y:275,r:46};
          }
        } else {
          const parent=parents[0],other=3-child-parent;
          const childMeetsOther=overlaps(child,other);
          if (proper(parent,other)) {
            circles[other]={x:550,y:275,r:190};
            circles[parent]={x:550,y:275,r:112};
            circles[child]={x:550,y:275,r:48};
          } else if (proper(other,parent)) {
            circles[parent]={x:470,y:275,r:185};
            circles[other]={x:540,y:275,r:62};
            circles[child]={x:childMeetsOther?485:360,y:275,r:53};
          } else if (!overlaps(parent,other)) {
            circles[parent]={x:365,y:275,r:165};
            circles[other]={x:800,y:275,r:145};
            circles[child]={x:365,y:275,r:58};
          } else {
            circles[parent]={x:450,y:275,r:180};
            circles[other]={x:640,y:275,r:150};
            circles[child]={x:childMeetsOther?510:355,y:275,r:53};
          }
        }
        return {circles};
      }
      if (actual.has(7)) return {standard:true,circles:[
        {x:460,y:210,r:120},
        {x:640,y:210,r:120},
        {x:550,y:365,r:120}
      ]};
      // Three pairwise overlaps with no common element form an annulus.
      if ([3,5,6].every(mask=>actual.has(mask))) return {circles:
        [-Math.PI/2,Math.PI/6,5*Math.PI/6].map(angle=>({
          type:'annular-sector',x:550,y:275,inner:72,r:180,
          angle,halfAngle:4*Math.PI/9
        }))
      };
      // One isolated set and two intersecting sets: all three circles match in size.
      for (let isolated=0; isolated<3; isolated++) {
        const [first,second]=[0,1,2].filter(i=>i!==isolated);
        const pair=1<<first | 1<<second;
        if (actual.has(pair) && ![...actual].some(mask=>
          (mask&(1<<isolated)) && (mask&(1<<first | 1<<second)))) {
          const circles=[];
          circles[first]={x:360,y:275,r:140};
          circles[second]={x:560,y:275,r:140};
          circles[isolated]={x:850,y:275,r:140};
          return {circles};
        }
      }
      const wanted=[...actual].filter(Boolean);
      const candidate=(a,b,c)=>[a,b,c];
      const patterns=[];
      const left={x:420,y:275,r:165},right={x:640,y:275,r:165};
      for(let i=0;i<3;i++) {
        let j=(i+1)%3,k=(i+2)%3;
        const other=[left,right];
        // If a set is the intersection of two others, their shared lens is its boundary.
        const intersection=[...actual].every(m=>!!(m&(1<<i))===!!((m&(1<<j))&&(m&(1<<k))));
        if(intersection) {
          const circles=[];circles[j]=other[0];circles[k]=other[1];circles[i]=null;
          patterns.push({circles, alias:i, intersection:[j,k]});
        }
        const inside=[...actual].every(m=>!(m&(1<<i)) || !!((m&(1<<j))&&(m&(1<<k))));
        if(inside && !intersection) {
          const circles=[];circles[j]=other[0];circles[k]=other[1];circles[i]={x:530,y:275,r:49};
          patterns.push({circles});
        }
      }
      // Equality: omit the duplicate boundary and label both names on one circle.
      for(let i=0;i<3;i++)for(let j=i+1;j<3;j++) {
        if([...actual].every(m=>!!(m&(1<<i))===!!(m&(1<<j)))) {
          const k=3-i-j, circles=[];circles[i]=left;circles[j]=null;circles[k]=right;
          patterns.push({circles,alias:j,equal:i});
        }
      }
      const bases=[
        [{x:410,y:230,r:150},{x:650,y:230,r:150},{x:530,y:365,r:150}],
        [{x:350,y:265,r:130},{x:675,y:265,r:130},{x:530,y:300,r:135}],
        [{x:340,y:260,r:125},{x:590,y:260,r:125},{x:835,y:260,r:125}],
        [{x:520,y:275,r:190},{x:510,y:275,r:90},{x:760,y:275,r:95}],
        [{x:380,y:275,r:175},{x:590,y:275,r:110},{x:650,y:275,r:52}],
        [{x:390,y:270,r:170},{x:650,y:270,r:170},{x:520,y:270,r:60}],
        [{x:330,y:265,r:120},{x:615,y:265,r:120},{x:795,y:265,r:78}]
      ];
      for(const base of bases) for(const order of [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]]) {
        const circles=[];order.forEach((index,i)=>circles[index]=base[i]);patterns.push({circles});
      }
      for(const pattern of patterns) {
        const got=circleMasks(pattern.circles);
        if(pattern.alias!==undefined) {
          const source=pattern.intersection ? null : pattern.equal;
          const expanded=new Set([...got].map(m=> m | ((pattern.intersection ? pattern.intersection.every(i=>m&(1<<i)) : m&(1<<source)) ? 1<<pattern.alias : 0)));
          if(wanted.every(m=>expanded.has(m)) && [...expanded].every(m=>actual.has(m)))return pattern;
        } else if(wanted.every(m=>got.has(m)) && [...got].every(m=>actual.has(m)))return pattern;
      }
      // The strict templates above may reject a circle picture solely because
      // it includes a region with no elements. Keep that region empty instead.
      const overlappingPairs=[[0,1],[0,2],[1,2]].filter(([i,j])=>
        [...actual].some(mask=>(mask&(1<<i)) && (mask&(1<<j))));
      if (overlappingPairs.length===2) {
        const middle=[0,1,2].find(i=>overlappingPairs.every(pair=>pair.includes(i)));
        const [leftIndex,rightIndex]=[0,1,2].filter(i=>i!==middle);
        const circles=[];
        circles[leftIndex]={x:340,y:275,r:145};
        circles[middle]={x:550,y:275,r:145};
        circles[rightIndex]={x:760,y:275,r:145};
        return {circles};
      }
      if (overlappingPairs.length===0) return {circles:[
        {x:270,y:275,r:120},{x:550,y:275,r:120},{x:830,y:275,r:120}
      ]};
      return null;
    }
    function expandedMask(mask,layout) {
      if(layout.alias===undefined) return mask;
      const yes=layout.intersection ? layout.intersection.every(i=>mask&(1<<i)) : !!(mask&(1<<layout.equal));
      return mask | (yes?1<<layout.alias:0);
    }
    function describe(mask) {
      const included=['A','B','C'].filter((_,i)=>mask&(1<<i));
      const excluded=['A','B','C'].filter((_,i)=>!(mask&(1<<i)));
      const formula=included.length ? included.join(' \\cap ') : 'U';
      const latex=excluded.length ? `${included.length>1?'('+formula+')':formula} \\setminus ${excluded.length>1?'('+excluded.join(' \\cup ')+')':excluded[0]}`:formula;
      const words=included.length ? `in ${included.join(', ')}${excluded.length?' but not in '+excluded.join(', '):''}` : 'outside A, B, and C';
      return {latex,words:`Elements ${words}.`};
    }
    function diagramExplanation(actual,layout) {
      if (layout?.standard) return '';
      const names=['A','B','C'];
      const includes=(mask,i)=>!!(mask&(1<<i));
      const subset=(i,j)=>[...actual].every(mask=>!includes(mask,i)||includes(mask,j));
      const facts=[];
      if (layout?.intersection) {
        const [j,k]=layout.intersection;
        facts.push(`${names[layout.alias]}=${names[j]}\\cap ${names[k]}`);
      } else {
        const child=[0,1,2].find(i=>[0,1,2].filter(j=>i!==j&&subset(i,j)&&!subset(j,i)).length===2);
        if (child!==undefined) {
          const [j,k]=[0,1,2].filter(i=>i!==child);
          const properIntersection=[...actual].some(mask=>includes(mask,j)&&includes(mask,k)&&!includes(mask,child));
          facts.push(`${names[child]}${properIntersection?'\\subset':'='}(${names[j]}\\cap ${names[k]})`);
        } else {
          for(let i=0;i<3;i++) for(let j=i+1;j<3;j++) {
            if (subset(i,j)&&subset(j,i)) facts.push(`${names[i]}=${names[j]}`);
            else if (subset(i,j)) facts.push(`${names[i]}\\subset ${names[j]}`);
            else if (subset(j,i)) facts.push(`${names[j]}\\subset ${names[i]}`);
          }
        }
      }
      for(let i=0;i<3;i++) for(let j=i+1;j<3;j++) {
        if (![...actual].some(mask=>includes(mask,i)&&includes(mask,j)))
          facts.push(`${names[i]}\\cap ${names[j]}=\\emptyset`);
      }
      if (!actual.has(7) && !facts.length) facts.push('A\\cap B\\cap C=\\emptyset');
      return facts.length ? `The diagram reflects \\(${facts.join('\\), \\(')}\\).` : '';
    }
    function drawCircleLabel(ctx,label,c,direction) {
      const gap=12;
      const diagonal=c.r/Math.SQRT2+gap;
      let x=c.x,y=c.y-c.r-gap;
      ctx.textAlign='center';
      if(direction==='above-left') {
        x=c.x-diagonal;y=c.y-diagonal;ctx.textAlign='right';
      } else if(direction==='above-right') {
        x=c.x+diagonal;y=c.y-diagonal;ctx.textAlign='left';
      } else if(direction==='below-right') {
        x=c.x+diagonal;y=c.y+diagonal+15;ctx.textAlign='left';
      }
      ctx.fillText(label,x,y);
      ctx.textAlign='left';
    }
    function labelDirections(actual,layout) {
      const directions=['above-left','above-right','above-right'];
      if(layout.standard) return ['above-left','above-right','below-right'];
      const circles=layout.circles;
      if(circles.some(c=>!c || c.type==='annular-sector')) return directions;
      const overlaps=(i,j)=>[...actual].some(mask=>(mask&(1<<i))&&(mask&(1<<j)));
      const subset=(i,j)=>[...actual].every(mask=>!(mask&(1<<i))||(mask&(1<<j)));
      const ordered=[0,1,2].sort((i,j)=>circles[j].r-circles[i].r);
      const nested=circles.every(c=>Math.hypot(c.x-circles[0].x,c.y-circles[0].y)<1);
      if(nested && circles[ordered[0]].r>circles[ordered[2]].r) {
        directions[ordered[0]]='above-left';
        directions[ordered[1]]='above-right';
        directions[ordered[2]]='above';
      } else {
        const child=[0,1,2].find(i=>[0,1,2].every(j=>j===i||subset(i,j)));
        if(child!==undefined && circles[child].r<Math.min(...[0,1,2].filter(i=>i!==child).map(i=>circles[i].r))) {
          directions[child]='above';
          const parents=[0,1,2].filter(i=>i!==child).sort((i,j)=>circles[i].x-circles[j].x);
          directions[parents[0]]='above-left';
          directions[parents[1]]='above-right';
        } else {
          const byX=[0,1,2].sort((i,j)=>circles[i].x-circles[j].x);
          directions[byX[0]]='above-left';
          directions[byX[1]]='above';
          directions[byX[2]]='above-right';
        }
      }
      // When A is isolated, identify it on the upper right of its circle.
      if(!overlaps(0,1)&&!overlaps(0,2)) directions[0]='above-right';
      return directions;
    }
    function render() {
      activityBox.innerHTML='';
      const canvas=document.createElement('canvas');canvas.width=1100;canvas.height=550;
      activityBox.appendChild(canvas);
      const ctx=canvas.getContext('2d');
      const layout=circleLayout(problem.masks);
      const cells=[];
      ctx.lineWidth=3;ctx.strokeStyle='#30343b';ctx.strokeRect(U.x,U.y,U.w,U.h);
      ctx.fillStyle='#202735';ctx.font='bold 25px sans-serif';ctx.fillText('U',U.x+U.w+12,U.y+18);
      if(layout) {
        const colors=['#326bb4','#bd5050','#39805b'];
        layout.circles.forEach((c,i)=>{
          if(!c)return;
          ctx.beginPath();
          if(c.type==='annular-sector') {
            ctx.arc(c.x,c.y,c.r,c.angle-c.halfAngle,c.angle+c.halfAngle);
            ctx.arc(c.x,c.y,c.inner,c.angle+c.halfAngle,c.angle-c.halfAngle,true);
            ctx.closePath();
          } else ctx.arc(c.x,c.y,c.r,0,2*Math.PI);
          ctx.strokeStyle=colors[i];ctx.lineWidth=4;ctx.stroke();
        });
        // Place labels at the same distance from each circular boundary.
        const directions=labelDirections(problem.masks,layout);
        layout.circles.forEach((c,i)=>{
          if(!c)return;
          ctx.fillStyle=colors[i];ctx.font='bold 28px sans-serif';
          const label='ABC'[i]+(layout.equal!==undefined&&layout.equal===i?' = '+'ABC'[layout.alias]:'');
          if(c.type==='annular-sector') ctx.fillText(label,c.x+205*Math.cos(c.angle)-12,c.y+205*Math.sin(c.angle)+8);
          else drawCircleLabel(ctx,label,c,directions[i]);
        });
        if(layout.intersection) {ctx.fillStyle=colors[layout.alias];ctx.font='bold 28px sans-serif';ctx.fillText('ABC'[layout.alias],525,275);}
      } else {
        // One cell for each nonempty logical region; cells are exact even for
        // relations no collection of three circles can draw.
        const present=[...problem.masks].filter(m=>m>0).sort((a,b)=>a-b);
        const cols=present.length<=4?present.length:4;
        const w=190,h=145,gap=25;
        present.forEach((mask,index)=>{
          const row=Math.floor(index/cols),col=index%cols;
          const x=U.x+(U.w-cols*w-(cols-1)*gap)/2+col*(w+gap);
          const y=U.y+45+row*(h+30);
          ctx.fillStyle='#f0f5fb';ctx.fillRect(x,y,w,h);
          ctx.strokeStyle='#476582';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);
          ctx.fillStyle='#26374a';ctx.font='bold 37px sans-serif';ctx.textAlign='center';
          ctx.fillText(['A','B','C'].filter((_,i)=>mask&(1<<i)).join(' ∩ '),x+w/2,y+82);
          ctx.textAlign='left';cells.push({x,y,w,h,mask});
        });
        ctx.fillStyle='#465568';ctx.font='18px sans-serif';ctx.fillText('Each box is one nonempty region; click a box'+(problem.masks.has(0)?' or the space outside them.':'.'),U.x+26,U.y+U.h-17);
      }
      regions={canvas,layout,cells};
      canvas.addEventListener('click',e=>{
        const rect=canvas.getBoundingClientRect();
        const x=(e.clientX-rect.left)*canvas.width/rect.width,y=(e.clientY-rect.top)*canvas.height/rect.height;
        if(x<U.x||x>U.x+U.w||y<U.y||y>U.y+U.h)return;
        let mask=layout?expandedMask(pointMask(x,y,layout.circles),layout):cells.find(c=>x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h)?.mask??0;
        showRegion(mask,e.clientX,e.clientY);
      });
    }
    function showRegion(mask,clientX,clientY) {
      activityBox.querySelector('.region-popup')?.remove();
      const popup=document.createElement('div');popup.className='region-popup';
      const close=document.createElement('button');close.textContent='×';close.setAttribute('aria-label','Close');close.onclick=()=>popup.remove();popup.appendChild(close);
      const title=document.createElement('strong');const desc=document.createElement('div');
      const info=describe(mask);title.textContent=`\\(${info.latex}\\)`;
      desc.textContent=problem.masks.has(mask) ? info.words : 'This region is empty for these sets.';
      popup.append(title,desc);activityBox.appendChild(popup);
      const box=activityBox.getBoundingClientRect();
      popup.style.left=Math.max(8,Math.min(clientX-box.left+10,box.width-popup.offsetWidth-8))+'px';
      popup.style.top=Math.max(8,Math.min(clientY-box.top+10,box.height-popup.offsetHeight-8))+'px';
      window.MathJax?.typesetPromise?.([title]);
    }
    startBtn.addEventListener('click',()=>{
      problem=makeProblem(); regions=null;activityBox.innerHTML='';hintArea.innerHTML='';hintBtn.disabled=false;
      problem.expression=generateSetExpression();
      problem.solutionMasks=new Set([...problem.masks].filter(mask=>expressionContains(problem.expression,mask)));
      questionText.innerHTML=`Let \\(U\\) be the ${problem.kind==='word'?'set of letters of the English alphabet':problem.labels[0].includes('mathbb{N}')?'set of natural numbers \\(\\{1,2,3,\\ldots\\}\\)':'set of integers'}.
        \\(A=${problem.labels[0]}\\),<br>\\(B=${problem.labels[1]}\\),<br>\\(C=${problem.labels[2]}\\)`;
      operationQuestion.innerHTML=`Find the set \\[${expressionTex(problem.expression)}\\]
        <small>Here, \\(X^{\\complement}=U\\setminus X\\).</small>`;
      window.MathJax?.typesetPromise?.([questionText,operationQuestion]);
    });
    hintBtn.addEventListener('click',()=>{
      if(!problem||regions)return;
      document.getElementById('click-sound')?.play().catch(()=>{});
      render();hintBtn.disabled=true;
      hintArea.innerHTML=`Hint 1: Click a region of the diagram to see its set notation and meaning.<br>${diagramExplanation(problem.masks,regions.layout)}`;
      window.MathJax?.typesetPromise?.([hintArea]);
    });
  </script>
  <audio id="click-sound" src="button.mp3" preload="auto"></audio>
</body>
