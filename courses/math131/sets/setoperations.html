  <script>
    const startBtn = document.getElementById('start-btn');
    const hintBtn = document.getElementById('hint-btn');
    const revealBtn = document.getElementById('reveal-btn');
    const diagramTools = document.getElementById('diagram-tools');
    const questionText = document.getElementById('question-text');

    const answerArea = document.getElementById('answer-area');
    const answerEditor = document.getElementById('set-answer');
    const answerToolbar = document.querySelector('.answer-toolbar');
    const checkBtn = document.getElementById('check-btn');
    const feedbackText = document.getElementById('feedbackText');
    const activityBox = document.getElementById('my-activity');
    const hintArea = document.getElementById('hint-area');
    const workingActivity = document.getElementById('working-activity');
    const pick = xs => xs[Math.floor(Math.random() * xs.length)];
    const rand = (a,b) => a + Math.floor(Math.random() * (b-a+1));
    let problem = null, regions = null, hintStep = 0, workingSteps = [];
    let diagramTool = 'cursor', paintedMasks = new Set();

    const OPERATIONS=['intersection','union','difference'];
    const TEX_NAMES={A:'A',B:'B',C:'C',empty:'\\emptyset',universe:'U'};
    const TEX_OPERATIONS={intersection:'\\cap',union:'\\cup',difference:'\\setminus'};
    function weightedSet(options) {
      let roll=Math.random()*100;
      for(const [name,weight] of options) {
        roll-=weight;
        if(roll<0)return name;
      }
      return options.at(-1)[0];
    }
    function firstPairSet() {
      return weightedSet([['A',28],['B',28],['C',28],['universe',8],['empty',8]]);
    }
    function secondPairSet(first) {
      if(first==='universe'||first==='empty') {
        return weightedSet([['A',31],['B',31],['C',31],
          [first==='universe'?'empty':'universe',7]]);
      }
      return weightedSet(['A','B','C'].map(name=>[name,name===first?4:40])
        .concat([['universe',8],['empty',8]]));
    }
    function generateSetExpression() {
      const pairCount=rand(1,3);
      const pairs=Array.from({length:pairCount},()=>{
        const first=firstPairSet();
        const pair={type:'operation',operation:pick(OPERATIONS),
          left:{type:'set',name:first},
          right:{type:'set',name:secondPairSet(first)}};
        return Math.random()<0.3 ? {type:'complement',operand:pair} : pair;
      });
      let expression=pairs[0];
      for(let i=1;i<pairs.length;i++) {
        expression={type:'operation',operation:pick(OPERATIONS),left:expression,right:pairs[i]};
      }
      return Math.random()<0.3 ? {type:'complement',operand:expression} : expression;
    }
    function expressionTex(node) {
      if(node.type==='set') return TEX_NAMES[node.name];
      if(node.type==='complement') {
        const operand=expressionTex(node.operand);
        const nested=node.operand.type==='complement' || expressionHasComplement(node.operand);
        const spaced=node.operand.type==='complement' ? `\\left[\\,${operand}\\,\\right]` : operand;
        return `\\overline{\\vphantom{${nested?'\\Bigg|':'\\big|'}}\\,${spaced}\\,}`;
      }
      const left=expressionTex(node.left),right=expressionTex(node.right);
      const opening=node.left.type==='set' ? '(' : '\\left[';
      const closing=node.left.type==='set' ? ')' : '\\right]';
      return `${opening}${left} ${TEX_OPERATIONS[node.operation]} ${right}${closing}`;
    }
    function expressionHasComplement(node) {
      return node.type==='complement' || (node.type==='operation' &&
        (expressionHasComplement(node.left)||expressionHasComplement(node.right)));
    }
    function expressionContains(node,mask) {
      if(node.type==='set') {
        if(node.name==='empty') return false;
        if(node.name==='universe') return true;
        return !!(mask&(1<<'ABC'.indexOf(node.name)));
      }
      if(node.type==='complement') return !expressionContains(node.operand,mask);
      const left=expressionContains(node.left,mask),right=expressionContains(node.right,mask);
      if(node.operation==='intersection') return left&&right;
      if(node.operation==='union') return left||right;
      return left&&!right;
    }

    // Common, concrete words; a word contributes each of its distinct letters once.

    const UNIQUE_WORDS = [...new Set(WORDS.filter(w => /^[a-z]{3,}$/.test(w)))];

    function masks(sets, universe) {
      const result = new Set();
      for (const x of universe) {
        let mask = 0;
        sets.forEach((set,i) => { if (set(x)) mask |= 1 << i; });
        result.add(mask);
      }
      return result;
    }
    function relations(p) {
      const m = p.masks;
      const subset = [0,1,2].some(i => [0,1,2].some(j => i !== j &&
        [...m].every(v => !(v & (1<<i)) || (v & (1<<j))) &&
        [...m].some(v => (v & (1<<j)) && !(v & (1<<i)))));
      const disjoint = [0,1,2].some(i => [0,1,2].some(j => i < j &&
        ![...m].some(v => (v & (1<<i)) && (v & (1<<j)))));
      return {subset,disjoint};
    }
    function wordProblem() {
      const words = Array.from({length:3}, () => pick(UNIQUE_WORDS));
      if (new Set(words).size !== 3) return null;
      const sets = words.map(w => new Set(w));
      const p = {kind:'word',words,labels:words.map(w => `\\{x\\mid x\\text{ is a letter in the word “${w}”}\\}`),
        masks:masks(sets.map(s => x => s.has(x)), 'abcdefghijklmnopqrstuvwxyz')};
      return [1,2,4].every(bit => [...p.masks].some(m => m & bit)) ? p : null;
    }
    function intervalProblem(unbounded) {
      const natural = Math.random() < 0.38;
      const domainMin = natural ? 1 : -Infinity;
      const intervals = Array.from({length:3}, () => {
        let lo = rand(natural ? -8 : -12, natural ? 13 : 10), hi = lo + rand(2,13);
        let left = Math.random()<0.5, right = Math.random()<0.5;
        if (unbounded && Math.random()<0.42) {
          if (Math.random()<0.5) lo=-Infinity; else hi=Infinity;
        }
        return {lo,hi,left,right};
      });
      // A lower-unbounded inequality over N is finite; require an upper-
      // unbounded one somewhere so this problem type truly includes infinity.
      if (unbounded && !intervals.some(v => v.hi===Infinity || (!natural && v.lo===-Infinity))) {
        pick(intervals).hi=Infinity;
      }
      // A displayed unbounded condition must still put a genuine restriction on x.
      // Over N, a lower bound below 1 describes the whole universe.
      if(intervals.some(v => v.lo===-Infinity && v.hi===Infinity ||
          natural && v.hi===Infinity && (v.lo<1 || v.lo===1 && v.left)))return null;
      const contains=(v,x) => x>=domainMin && (x>v.lo || (v.left && x===v.lo)) && (x<v.hi || (v.right && x===v.hi));
      const endpoints = intervals.flatMap(v=>[v.lo,v.hi]).filter(Number.isFinite);
      const min=Math.min(...endpoints, natural?1:-15)-2, max=Math.max(...endpoints,18)+2;
      const samples=[]; for(let x=min;x<=max;x++) samples.push(x);
      if (!natural) samples.push(min-10000); samples.push(max+10000);
      const domain=natural?'\\mathbb{N}':'\\mathbb{Z}';
      const labels=intervals.map(v => {
        const lo=isFinite(v.lo)?`${v.lo} ${v.left?'\\leq':'<'} x`:'';
        const hi=isFinite(v.hi)?`x ${v.right?'\\leq':'<'} ${v.hi}`:'';
        return `\\{x\\in ${domain}\\mid ${lo && hi ? `${lo} ${v.right?'\\leq':'<'} ${v.hi}` : lo || hi}\\}`;
      });
      const p={kind:unbounded?'unbounded':'bounded',natural,intervals,labels,
        masks:masks(intervals.map(v=>x=>contains(v,x)),samples)};
      return [1,2,4].every(bit=>[...p.masks].some(m=>m&bit))?p:null;
    }
    function relationshipCase(p) {
      const ms=[...p.masks];
      const has=(mask,i)=>!!(mask&(1<<i));
      const proper=(i,j)=>i!==j && ms.every(mask=>!has(mask,i)||has(mask,j)) &&
        ms.some(mask=>has(mask,j)&&!has(mask,i));
      const subsets=[];
      for(let i=0;i<3;i++) for(let j=0;j<3;j++) if(proper(i,j)) subsets.push([i,j]);
      const disjoint=[];
      for(let i=0;i<3;i++) for(let j=i+1;j<3;j++)
        if(!ms.some(mask=>has(mask,i)&&has(mask,j))) disjoint.push([i,j]);
      if(subsets.length && disjoint.length) {
        return disjoint.length===2 ? 'mixed-isolated' : 'mixed-overlap';
      }
      if(subsets.length) return subsets.length>=3 ? 'subset-chain' :
        subsets.length===2 ? 'subset-both' : 'subset-one';
      if(disjoint.length) return ['','disjoint-pair','disjoint-isolated','disjoint-all'][disjoint.length];
      return 'neither';
    }
    // A word chain is rare under independent draws, so build its three words
    // directly from their letter sets while keeping the word database random.
    let wordChains=null;
    function wordChainProblem() {
      if(!wordChains) {
        const letters=UNIQUE_WORDS.map(word=>[...word].reduce((bits,ch)=>bits|(1<<(ch.charCodeAt(0)-97)),0));
        const smaller=letters.map(()=>[]),larger=letters.map(()=>[]);
        for(let i=0;i<letters.length;i++) for(let j=0;j<letters.length;j++) {
          if(letters[i]!==letters[j] && (letters[i]&letters[j])===letters[i]) {
            larger[i].push(j);smaller[j].push(i);
          }
        }
        wordChains={letters,smaller,larger,centres:letters.map((_,i)=>i).filter(i=>smaller[i].length&&larger[i].length)};
      }
      const centre=pick(wordChains.centres);
      const words=[pick(wordChains.smaller[centre]),centre,pick(wordChains.larger[centre])]
        .map(i=>UNIQUE_WORDS[i]);
      const shuffled=[...words];
      for(let i=shuffled.length-1;i>0;i--) {
        const j=rand(0,i);
        [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
      }
      const sets=shuffled.map(word=>new Set(word));
      return {kind:'word',words:shuffled,labels:shuffled.map(word=>`\\{x\\mid x\\text{ is a letter in the word “${word}”}\\}`),
        masks:masks(sets.map(set=>x=>set.has(x)),'abcdefghijklmnopqrstuvwxyz')};
    }
    function makeProblem() {
      const kind=rand(0,2);
      const target=Math.random();
      const group=target<0.3 ? ['subset-one','subset-both','subset-chain'] :
        target<0.6 ? ['disjoint-all','disjoint-isolated','disjoint-pair'] :
        target<0.65 ? ['mixed-isolated'] :
        target<0.7 ? ['mixed-overlap'] : ['neither'];
      const chosen=pick(group); // equal chance for each case within the 30% groups
      for(let attempt=0;attempt<30000;attempt++) {
        const p=kind===0 && chosen==='subset-chain' ? wordChainProblem() :
          kind===0 ? wordProblem() : intervalProblem(kind===2);
        if(p && relationshipCase(p)===chosen) return p;
      }
      throw new Error(`Unable to generate ${chosen} problem`);
    }

    // Where all three sets meet, use the familiar three-circle Venn diagram.
    // Its other regions can be empty without changing the diagram.
    const U={x:70,y:55,w:960,h:470};
    function inShape(x,y,c) {
      if (!c) return false;
      const distance=Math.hypot(x-c.x,y-c.y);
      if (c.type !== 'annular-sector') return distance<c.r;

          ctx.fillText('ABC'[layout.alias],525,275);
        }
      } else {
        const present=[...problem.masks].filter(mask=>mask>0).sort((a,b)=>a-b);
        const cols=Math.min(present.length,4),w=190,h=145,gap=25;
        present.forEach((mask,index)=>{
          const row=Math.floor(index/cols),col=index%cols;
          const x=U.x+(U.w-cols*w-(cols-1)*gap)/2+col*(w+gap),y=U.y+45+row*(h+30);
          if(expressionContains(node,mask)) {ctx.fillStyle='#93bfe7';ctx.fillRect(x,y,w,h);}
          ctx.strokeStyle='#476582';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);
          ctx.fillStyle='#26374a';ctx.font='bold 35px sans-serif';ctx.textAlign='center';
          ctx.fillText(['A','B','C'].filter((_,i)=>mask&(1<<i)).join(' ∩ '),x+w/2,y+82);
          ctx.textAlign='left';
        });
        if(problem.masks.has(0)&&expressionContains(node,0)) {
          ctx.fillStyle='#93bfe7';ctx.fillRect(U.x+10,U.y+U.h-65,130,46);
          ctx.fillStyle='#26374a';ctx.font='25px sans-serif';ctx.fillText('outside',U.x+17,U.y+U.h-32);
        }
      }
      ctx.restore();
    }
    function workingCard(node) {
      const card=document.createElement('div');card.className='working-card';
      const canvas=document.createElement('canvas');
      const label=document.createElement('div');label.className='working-card-label math';
      label.innerHTML=`\\(${expressionTex(node)}\\)`;
      card.append(canvas,label);miniDiagram(canvas,node);
      return card;
    }
    function workingSign(symbol) {
      const span=document.createElement('span');span.className='working-sign';
      span.textContent=symbol;return span;
    }
    function showWorkingStep(index) {
      const node=workingSteps[index];
      workingActivity.style.display='block';workingActivity.innerHTML='';
      const note=document.createElement('p');note.className='working-note';
      note.textContent='Work through one operation at a time. Shaded regions show each set.';
      workingActivity.appendChild(note);
      const top=document.createElement('div');
      top.className='working-row working-row-top'+(node.type==='complement'?' complement-step':'');
      if(node.type==='complement') {
        top.append(workingCard(node.operand),workingSign('→'),workingCard(node));
      } else {
        top.append(workingCard(node.left),workingSign({intersection:'∩',union:'∪',difference:'∖'}[node.operation]),
          workingCard(node.right),workingSign('='),workingCard(node));
      }
      workingActivity.appendChild(top);
      const bottom=document.createElement('div');bottom.className='working-row-bottom';
      const completed=new Set(workingSteps.slice(0,index));
      const waiting=pendingResults(problem.expression,completed,node);
      for(let i=0;i<3;i++) {
        if(waiting[i])bottom.appendChild(workingCard(waiting[i]));
        else {const blank=document.createElement('div');bottom.appendChild(blank);}
      }
      workingActivity.appendChild(bottom);
      window.MathJax?.typesetPromise?.([workingActivity]);
    }
    // Integer ranges have inclusive endpoints; either endpoint may be infinite.
    function mergeIntegerRanges(ranges) {
      const sorted=ranges.filter(r=>r.lo<=r.hi).sort((a,b)=>a.lo-b.lo || a.hi-b.hi);
      const result=[];
      for(const range of sorted) {
        const last=result[result.length-1];
        if(last && range.lo<=last.hi+1) last.hi=Math.max(last.hi,range.hi);
        else result.push({...range});
      }
      return result;
    }
    function intersectIntegerRanges(a,b) {
      const result=[];
      for(const first of a) for(const second of b) {
        const lo=Math.max(first.lo,second.lo),hi=Math.min(first.hi,second.hi);
        if(lo<=hi) result.push({lo,hi});
      }
      return mergeIntegerRanges(result);
    }
    function numericMaskAt(p,x) {
      return p.intervals.reduce((mask,v,i)=>mask | ((x>=(p.natural?1:-Infinity) &&
        (x>v.lo || v.left && x===v.lo) && (x<v.hi || v.right && x===v.hi)) ? 1<<i : 0),0);
    }
    function expectedIntegerRanges(p) {
      const cuts=new Set(p.natural?[1]:[]);
      for(const interval of p.intervals) {
        if(Number.isFinite(interval.lo)) cuts.add(interval.lo+(interval.left?0:1));
        if(Number.isFinite(interval.hi)) cuts.add(interval.hi+(interval.right?1:0));
      }
      const ordered=[...cuts].sort((a,b)=>a-b);
      const starts=[-Infinity,...ordered],ends=[...ordered.map(x=>x-1),Infinity];
      const selected=[];
      for(let i=0;i<starts.length;i++) {
        const lo=starts[i],hi=ends[i];
        if(lo>hi)continue;
        const sample=Number.isFinite(lo)?lo:Number.isFinite(hi)?hi:0;
        if((!p.natural || sample>=1) && expressionContains(p.expression,numericMaskAt(p,sample)))
          selected.push({lo,hi});
      }
      return mergeIntegerRanges(selected);
    }
    function expectedLetters(p) {
      return new Set('abcdefghijklmnopqrstuvwxyz'.split('').filter(letter=>{
        const mask=p.words.reduce((bits,word,i)=>bits|(word.includes(letter)?1<<i:0),0);
        return expressionContains(p.expression,mask);
      }));
    }
    function normalizeAnswerText(input) {
      return input.trim().replace(/\u200b/g,'').replace(/−/g,'-')
        .replace(/\\left|\\right/g,'').replace(/\\mathbb\s*\{\s*([ZN])\s*\}/gi,'$1')
        .replace(/\\text\s*\{\s*([^{}]*)\s*\}/gi,'$1')
        .replace(/\\(?:leq|le)\b/g,'≤').replace(/\\(?:geq|ge)\b/g,'≥')
        .replace(/\\infty\b|\binfinity\b|\binfty\b/gi,'∞')
        .replace(/\\cup\b/g,'∪').replace(/\\cap\b/g,'∩')
        .replace(/\\emptyset\b|\\varnothing\b/g,'∅')
        .replace(/\\(?:ldots|cdots|dots)\b|\.{3}|⋯/g,'…')
        .replace(/\\in\b/g,'∈').replace(/\\mid\b/g,'|')
        .replace(/\\\{/g,'{').replace(/\\\}/g,'}')
        .replace(/>=/g,'≥').replace(/<=/g,'≤')
        .replace(/ℤ/g,'Z').replace(/ℕ/g,'N')
        .replace(/,\s*(?=or\b)/gi,' ')
        .replace(/,\s*(?=inclusive\b|exclusive\b)/gi,' ')
        .replace(/\b(?:greater than or equal to|at least|no less than)\b/gi,'≥')
        .replace(/\b(?:less than or equal to|at most|no more than)\b/gi,'≤')
        .replace(/\b(?:greater than|more than|above)\b/gi,'>')
        .replace(/\b(?:less than|below|under)\b/gi,'<')
        .replace(/\s+/g,' ').trim();
    }
    function parseElementList(text,kind) {
      const match=/^\{\s*([^{}]*)\s*\}$/.exec(text);
      if(!match)return null;
      if(!match[1].trim())return [];
      const items=match[1].split(',').map(item=>item.trim());
      if(kind==='word') {
        if(!items.every(item=>/^[a-z]$/i.test(item)))return null;
        return [...new Set(items.map(item=>item.toLowerCase()))];
      }
      if(!items.every(item=>/^-?\d+$/.test(item)))return null;
      return [...new Set(items.map(Number))].sort((a,b)=>a-b);
    }
    function parseEllipsisList(text) {
      const match=/^\{\s*([^{}]*)\s*\}$/.exec(text);
      if(!match||!match[1].includes('…'))return null;
      let items=match[1].split(',').map(item=>item.trim());
      if(!items.every(item=>item==='…'||/^[+-]?\d+$/.test(item)))return null;
      const numbers=items.filter(item=>item!=='…').map(Number);
      if(numbers.length<2||!numbers.every(Number.isSafeInteger))return null;
      // Descending lists mean the same set; normalize to increasing order.
      if(numbers.every((number,i)=>i===0||number<numbers[i-1]))items=items.reverse();
      const leading=items[0]==='…',trailing=items.at(-1)==='…';
      if(leading)items=items.slice(1);
      if(trailing)items=items.slice(0,-1);
      // Each infinite tail needs consecutive integers to establish unit steps.
      if(items.includes('…'))return null;
      const values=items.map(Number);
      if(values.some((value,i)=>i>0&&value<=values[i-1]))return null;
      if(leading&&values[1]!==values[0]+1)return null;
      if(trailing&&values.at(-1)!==values.at(-2)+1)return null;
      const ranges=values.map(value=>({lo:value,hi:value}));
      if(leading)ranges.push({lo:-Infinity,hi:values[0]});
      if(trailing)ranges.push({lo:values.at(-1),hi:Infinity});
      return mergeIntegerRanges(ranges);
    }
    function parseEndpoint(text) {
      const token=text.trim().replace(/^\+/,'');
      if(token==='∞')return Infinity;
      if(token==='-∞')return -Infinity;
      return /^-?\d+$/.test(token)?Number(token):NaN;
    }
    function parseIntervalAtom(text) {
      const t=text.replace(/\s+/g,'');
      if(!/^[([]/.test(t) || !/[)\]]$/.test(t))return null;
      const parts=t.slice(1,-1).split(',');
      if(parts.length!==2)return null;
      const left=parseEndpoint(parts[0]),right=parseEndpoint(parts[1]);
      if(Number.isNaN(left)||Number.isNaN(right)||left===Infinity||right===-Infinity||left>right)return null;
      const lo=left===-Infinity?-Infinity:left+(t[0]==='['?0:1);
      const hi=right===Infinity?Infinity:right-(t.at(-1)===']'?0:1);
      return lo<=hi?[{lo,hi}]:[];
    }
    function parseInequalityAtom(text) {
      const t=text.toLowerCase().replace(/\bx\s+is\s+/g,'x ').replace(/\s+/g,'')
        .replace(/≤/g,'<=').replace(/≥/g,'>=');
      const tokens=t.match(/x|-?\d+|<=|>=|<|>/g);
      if(!tokens||tokens.join('')!==t||![3,5].includes(tokens.length))return null;
      let result=[{lo:-Infinity,hi:Infinity}];
      for(let i=0;i<tokens.length-2;i+=2) {
        const [left,op,right]=tokens.slice(i,i+3);
        if((left==='x')===(right==='x')||!['<','<=','>','>='].includes(op))return null;
        const n=Number(left==='x'?right:left);
        if(!Number.isInteger(n))return null;
        const xOnLeft=left==='x';
        const lower=xOnLeft?(op==='>'||op==='>='):(op==='<'||op==='<=');
        const inclusive=op==='>='||op==='<=',bound=lower?
          {lo:n+(inclusive?0:1),hi:Infinity}:{lo:-Infinity,hi:n-(inclusive?0:1)};
        result=intersectIntegerRanges(result,[bound]);
      }
      return result;
    }
    function parseWordAtom(text) {
      const t=text.trim().replace(/^x\s+(?:is\s+)?/i,'');
      const between=/^(?:between|from)\s+(-?\d+)\s+(?:and|to)\s+(-?\d+)(?:\s+(inclusive|exclusive))?$/i.exec(t);
      if(between) {
        const left=Number(between[1]),right=Number(between[2]),inclusive=between[3]?.toLowerCase()==='inclusive';
        if(left>right)return null;
        const lo=left+(inclusive?0:1),hi=right-(inclusive?0:1);
        return lo<=hi?[{lo,hi}]:[];
      }
      const relation=/^(≤|≥|<|>)\s*(-?\d+)$/i.exec(t);
      if(relation)return parseInequalityAtom(`x ${relation[1]} ${relation[2]}`);
      const reversed=/^(-?\d+)\s*(≤|≥|<|>)\s*x$/i.exec(t);
      if(reversed)return parseInequalityAtom(t);
      return null;
    }
    function splitOutside(text,symbol,word) {
      const parts=[];let current='',depth=0;
      for(let i=0;i<text.length;i++) {
        const ch=text[i];
        if(ch==='('||ch==='[')depth++;
        if(ch===')'||ch===']')depth--;
        const matchWord=word && text.slice(i,i+word.length).toLowerCase()===word &&
          !/[a-z]/i.test(text[i-1]||'') && !/[a-z]/i.test(text[i+word.length]||'');
        if(depth===0 && (ch===symbol||matchWord)) {
          parts.push(current.trim());current='';if(matchWord)i+=word.length-1;
        } else current+=ch;
        if(depth<0)return null;
      }
      if(depth!==0)return null;
      parts.push(current.trim());
      return parts.every(Boolean)?parts:null;
    }
    function parseNumericDescription(text) {
      const t=text.trim().replace(/\b(between\s+-?\d+\s+|from\s+-?\d+\s+)and(?=\s+-?\d+\b)/gi,'$1to');
      if(!t)return null;
      const unions=splitOutside(t,'∪','or');
      if(!unions)return null;
      if(unions.length>1) {
        const parsed=unions.map(parseNumericDescription);
        return parsed.some(part=>part===null)?null:mergeIntegerRanges(parsed.flat());
      }
      const atom=parseIntervalAtom(t) ?? parseInequalityAtom(t) ?? parseWordAtom(t);
      if(atom!==null)return atom;
      const intersections=splitOutside(t,'∩','and');
      if(!intersections||intersections.length===1)return null;
      let result=[{lo:-Infinity,hi:Infinity}];
      for(const part of intersections) {
        const parsed=parseNumericDescription(part);
        if(parsed===null)return null;
        result=intersectIntegerRanges(result,parsed);
      }
      return result;
    }
    function parseNumericAnswer(raw,p) {
      let text=normalizeAnswerText(raw);
      if(text==='∅'||text==='{}')return [];
      if(/^U$/i.test(text))return [{lo:p.natural?1:-Infinity,hi:Infinity}];
      if(/^[NZ]$/i.test(text))return [{lo:text.toUpperCase()==='N'?1:-Infinity,hi:Infinity}];
      const wholeDomain=/^\{\s*x\s*(?:∈|in)\s*([NZ])\s*\}$/i.exec(text);
      if(wholeDomain)return [{lo:wholeDomain[1].toUpperCase()==='N'?1:-Infinity,hi:Infinity}];
      const elements=parseElementList(text,'number');
      if(elements!==null)return mergeIntegerRanges(elements.map(n=>({lo:n,hi:n})));
      const ellipsisList=parseEllipsisList(text);
      if(ellipsisList!==null)return ellipsisList;
      const builder=/^\{\s*x\s*(?:∈|in)\s*([ZN])\s*(?:\||:|such that)\s*([\s\S]+)\s*\}$/i.exec(text);
      if(!builder)return null;
      const domain=builder[1].toUpperCase();text=builder[2].trim();
      text=text.replace(/^x\s*(?:∈|in)\s*(?=[([])/i,'');
      const ranges=parseNumericDescription(text);
      if(ranges===null)return null;
      return domain==='N'?intersectIntegerRanges(ranges,[{lo:1,hi:Infinity}]):ranges;
    }
    function rangesEqual(a,b) {
      return a.length===b.length && a.every((range,i)=>range.lo===b[i].lo&&range.hi===b[i].hi);
    }
    function checkSetAnswer() {
      if(!problem)return false;
      const raw=answerEditor.value.trim();
      if(problem.kind==='word') {
        const given=raw==='∅'||/^\\emptyset$/.test(raw)?[]:parseElementList(normalizeAnswerText(raw),'word');
        return given!==null && given.length===problem.solutionLetters.size &&
          given.every(letter=>problem.solutionLetters.has(letter));
      }
      const given=parseNumericAnswer(raw,problem);
      return given!==null && rangesEqual(given,problem.solutionRanges);
    }
    const ANSWER_SYMBOLS=[['∅','∅'],['…','…'],['∪',' ∪ '],['∩',' ∩ '],['or',' or '],['and',' and '],
      ['x','x'],['∞','∞'],['−∞','-∞'],['≥','≥'],['≤','≤'],['<','<'],['>','>'],
      ['{','{'],['}','}'],['[','['],[']',']'],['(', '('],[')',')'],
      ['∈',' ∈ '],['ℤ','ℤ'],['ℕ','ℕ'],['|',' | '],[',',', ']];
    for(const [label,insert] of ANSWER_SYMBOLS) {
      const button=document.createElement('button');
      button.type='button';button.className='math-symbol-button';button.textContent=label;
      button.setAttribute('aria-label',`Insert ${label}`);
      button.addEventListener('mousedown',event=>event.preventDefault());
      button.addEventListener('click',()=>{
        const start=answerEditor.selectionStart,end=answerEditor.selectionEnd;
        answerEditor.setRangeText(insert,start,end,'end');answerEditor.focus();
        feedbackText.textContent='';
      });
      answerToolbar.appendChild(button);
    }
    answerEditor.addEventListener('input',()=>{feedbackText.textContent='';});
    diagramTools.querySelectorAll('.diagram-tool').forEach(button=>button.addEventListener('click',()=>{
      diagramTool=button.dataset.tool;
      activityBox.dataset.tool=diagramTool;
      diagramTools.querySelectorAll('.diagram-tool').forEach(item=>
        item.setAttribute('aria-pressed',String(item===button)));
    }));
    checkBtn.addEventListener('click',()=>{
      if(!problem||!regions)return;
      const textCorrect=checkSetAnswer(),shadingCorrect=checkDiagramShading();
      feedbackText.textContent=textCorrect&&shadingCorrect?'Correct!':
        !textCorrect&&!shadingCorrect?'Incorrect, try again.':
        textCorrect?'The set description is correct but the Venn diagram shading is not.':
          'The Venn diagram shading is correct but the set description is not.';
      feedbackText.style.color=textCorrect&&shadingCorrect?'green':
        !textCorrect&&!shadingCorrect?'red':'#9a6b00';
    });
    startBtn.addEventListener('click',()=>{
      problem=makeProblem(); regions=null;hintStep=0;paintedMasks=new Set();diagramTool='cursor';
      activityBox.innerHTML='';hintArea.innerHTML='';workingActivity.innerHTML='';workingActivity.style.display='none';
      activityBox.dataset.tool='cursor';revealBtn.style.display='inline-block';
      hintBtn.style.display='none';hintBtn.disabled=true;
      diagramTools.style.display='none';
      diagramTools.querySelectorAll('.diagram-tool').forEach(button=>
        button.setAttribute('aria-pressed',String(button.dataset.tool==='cursor')));
      problem.expression=generateSetExpression();
      workingSteps=operationSteps(problem.expression);
      problem.solutionMasks=new Set([...problem.masks].filter(mask=>expressionContains(problem.expression,mask)));
      if(problem.kind==='word')problem.solutionLetters=expectedLetters(problem);
      else problem.solutionRanges=expectedIntegerRanges(problem);
      answerArea.style.display='block';checkBtn.style.display='none';
      answerEditor.value='';feedbackText.textContent='';
      answerEditor.placeholder=problem.kind==='word' ? '{a, b, c}' :
        '{x ∈ ℤ | -2 ≤ x ≤ 3 or x ≥ 8}';
      questionText.innerHTML=`Let \\(U\\) be the ${problem.kind==='word'?'set of letters of the English alphabet':problem.labels[0].includes('mathbb{N}')?'set of natural numbers \\(\\{1,2,3,\\ldots\\}\\)':'set of integers'}.
        \\(A=${problem.labels[0]}\\),<br>\\(B=${problem.labels[1]}\\),<br>\\(C=${problem.labels[2]}\\)`;
      operationQuestion.innerHTML=`Find the set \\[${expressionTex(problem.expression)}\\]
        <p>On paper, try drawing a Venn diagram representing the interactions between the sets, and shade in the desired region.<br>Then, press Reveal Diagram to reveal the unshaded diagram.</p>`;
      window.MathJax?.typesetPromise?.([questionText,operationQuestion]);
    });
    revealBtn.addEventListener('click',()=>{
      if(!problem||regions)return;
      document.getElementById('click-sound')?.play().catch(()=>{});
      render();revealBtn.style.display='none';
      checkBtn.style.display='inline-block';hintBtn.style.display='inline-block';hintBtn.disabled=false;
      diagramTools.style.display='flex';
      hintArea.innerHTML=`Click a region of the diagram to see its set notation and meaning.<br>${diagramExplanation(problem.masks,regions.layout)}`;
      window.MathJax?.typesetPromise?.([hintArea]);
    });
    hintBtn.addEventListener('click',()=>{
      if(!problem||!regions||hintStep>=workingSteps.length)return;
      document.getElementById('click-sound')?.play().catch(()=>{});
      showWorkingStep(hintStep);
      hintStep++;
      if(hintStep>=workingSteps.length)hintBtn.disabled=true;
    });
  </script>
  <audio id="click-sound" src="button.mp3" preload="auto"></audio>
